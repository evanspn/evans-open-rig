name: pr-watcher
version: "1.0"
description: PR watcher - tracks open PRs for build failures and review comments, merges finished ones

defaults:
  runtime: claude-code
  model: claude-haiku-4-5-20251001

imports:
  - ref: local:../../../../../../../opt/homebrew/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: [verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
